# Cloudflare Pages Functions configuration for Bill Vampire.
# Needed in dev so `wrangler pages dev` can bind the KV + env vars used by
# functions/api/*.js and functions/_scheduled/*.js.

name = "bill-vampire"
compatibility_date = "2026-04-01"
pages_build_output_dir = "dist"

# ------- Scheduled triggers -------
# Pages doesn't support cron triggers in wrangler.toml. The Sunday digest
# runs as a separate Worker at workers/weekly-digest/ with its own cron.

# ------- KV bindings -------
# EMAIL_LIST stores { "sub:<email>": JSON } for Sunday digest subscribers.
# Consumed by functions/api/email-subscribe.js. The same namespace is also
# bound on workers/weekly-digest/ so the Sunday cron reads from the same list.
# NOTE: the Pages dashboard shows "Bindings are managed through wrangler.toml"
# — this block is what produces env.EMAIL_LIST at runtime.
[[kv_namespaces]]
binding = "EMAIL_LIST"
id = "006bcf18eaaf4ce9b7ac06a864d22d48"

# RATE_LIMIT stores IP-based free AI parsing counters.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "37bdf258b09c437f8857b008d7d35779"

# ------- D1 bindings -------
[[d1_databases]]
binding = "BV_DB"
database_name = "bill-vampire-prod"
database_id = "05775d4c-7c3c-4606-af64-58a6a97ce423"

# ------- Env vars (set via dashboard Variables & Secrets, or `wrangler secret put`) -------
# GEMINI_API_KEY   — Google Gemini 2.5 Flash key, used by functions/api/gemini.js
# JWT_SIGNING_KEY  — 32+ byte random string, used by functions/api/pro-token.js
#                    to sign the bv_pro cookie consumed by the Chrome extension
# AUTH_SESSION_SECRET — 32+ byte random string for web app auth sessions.
# RESEND_API_KEY      — optional on Pages; sends magic links from auth/start.
# AUTH_EMAIL_FROM     — optional; defaults to Bill Vampire <hello@billvampire.com>.
# GOOGLE_CLIENT_ID    — optional; enables "Continue with Google".
# GOOGLE_CLIENT_SECRET — optional; enables Google OAuth callback token exchange.
# CREEM_WEBHOOK_SECRET — required for /api/creem/webhook signature verification.
# CREEM_EMERGENCY_KIT_PRODUCT_ID — optional override; defaults to prod_5nLkYvnA8LPlZp49NvjXKZ.
# CREEM_PRO_PRODUCT_ID, CREEM_PATROL_MONTHLY_PRODUCT_ID, CREEM_PATROL_ANNUAL_PRODUCT_ID
#                    — optional product-id overrides for entitlement sync.
# The weekly-digest Worker has its own RESEND_API_KEY binding.

[vars]
AUTH_EMAIL_FROM = "Bill Vampire <hello@billvampire.com>"
CREEM_EMERGENCY_KIT_PRODUCT_ID = "prod_5nLkYvnA8LPlZp49NvjXKZ"
CREEM_PRO_PRODUCT_ID = "prod_1pw0aIvQW2CzNzfMLrgGAY"
CREEM_PATROL_MONTHLY_PRODUCT_ID = "prod_3l1JRnKrbMvuYiWez8JDGw"
