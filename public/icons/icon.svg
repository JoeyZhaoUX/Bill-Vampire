<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fda4af"/>
      <stop offset="50%" style="stop-color:#e11d48"/>
      <stop offset="100%" style="stop-color:#9f1239"/>
    </linearGradient>
    <linearGradient id="cape" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5b21b6"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="capeInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#4c1d95"/>
    </linearGradient>
    <linearGradient id="skin" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#fefce8"/>
      <stop offset="100%" style="stop-color:#fef08a"/>
    </linearGradient>
    <linearGradient id="hair" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#0f0a2e"/>
    </linearGradient>
    <linearGradient id="bill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000033"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="eye-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#fca5a5"/>
      <stop offset="60%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#7f1d1d"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Cape outer - dramatic spread -->
  <path d="M120 260 C100 300 82 390 78 465 L434 465 C430 390 412 300 392 260
           C380 272 365 280 348 280 L164 280 C147 280 132 272 120 260 Z"
        fill="url(#cape)" filter="url(#shadow)"/>

  <!-- Cape inner lining -->
  <path d="M150 280 C138 320 125 395 122 455 L390 455 C387 395 374 320 362 280 Z"
        fill="url(#capeInner)" opacity="0.5"/>

  <!-- Shirt / chest -->
  <path d="M210 272 L218 350 L294 350 L302 272 Z" fill="#1e1b4b"/>
  <line x1="256" y1="278" x2="256" y2="350" stroke="#312e81" stroke-width="2"/>

  <!-- Head shape -->
  <ellipse cx="256" cy="195" rx="78" ry="85" fill="url(#skin)" filter="url(#shadow)"/>

  <!-- Cheek blush -->
  <ellipse cx="198" cy="218" rx="18" ry="10" fill="#fda4af" opacity="0.4"/>
  <ellipse cx="314" cy="218" rx="18" ry="10" fill="#fda4af" opacity="0.4"/>

  <!-- Hair - slicked back with volume -->
  <path d="M178 190 C178 130 205 95 256 88 C307 95 334 130 334 190
           C334 160 315 120 256 112 C197 120 178 160 178 190 Z"
        fill="url(#hair)"/>
  <!-- Widow's peak - sharper -->
  <path d="M226 132 L256 168 L286 132 C273 112 239 112 226 132 Z" fill="url(#hair)"/>
  <!-- Hair side swoops -->
  <path d="M178 190 C172 175 170 158 178 142 L188 168 Z" fill="url(#hair)"/>
  <path d="M334 190 C340 175 342 158 334 142 L324 168 Z" fill="url(#hair)"/>

  <!-- Ears - pointed elf style -->
  <path d="M178 195 L152 155 L182 188" fill="url(#skin)"/>
  <path d="M178 195 L158 163 L180 190" fill="#fde047" opacity="0.3"/>
  <path d="M334 195 L360 155 L330 188" fill="url(#skin)"/>
  <path d="M334 195 L354 163 L332 190" fill="#fde047" opacity="0.3"/>

  <!-- Eyebrows - arched dramatically -->
  <path d="M206 172 Q224 158 248 168" stroke="#1e1b4b" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M264 168 Q288 158 306 172" stroke="#1e1b4b" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Eyes - larger, more expressive -->
  <ellipse cx="226" cy="198" rx="20" ry="22" fill="white"/>
  <ellipse cx="286" cy="198" rx="20" ry="22" fill="white"/>
  <!-- Irises - glowing red -->
  <ellipse cx="230" cy="200" rx="13" ry="14" fill="url(#eye-glow)"/>
  <ellipse cx="290" cy="200" rx="13" ry="14" fill="url(#eye-glow)"/>
  <!-- Pupils - slit style -->
  <ellipse cx="232" cy="200" rx="4" ry="10" fill="#1e1b4b"/>
  <ellipse cx="292" cy="200" rx="4" ry="10" fill="#1e1b4b"/>
  <!-- Eye shine - double highlights -->
  <ellipse cx="236" cy="194" rx="4" ry="3.5" fill="white" opacity="0.9"/>
  <ellipse cx="296" cy="194" rx="4" ry="3.5" fill="white" opacity="0.9"/>
  <ellipse cx="228" cy="204" rx="2" ry="1.5" fill="white" opacity="0.5"/>
  <ellipse cx="288" cy="204" rx="2" ry="1.5" fill="white" opacity="0.5"/>

  <!-- Nose - subtle -->
  <path d="M252 218 Q256 224 260 218" stroke="#d4a574" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Mouth - confident smirk -->
  <path d="M228 240 Q242 252 256 248 Q270 252 284 240" stroke="#1e1b4b" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Fangs - prominent, gleaming -->
  <path d="M234 240 L228 262 L240 242" fill="white" filter="url(#glow)"/>
  <path d="M278 240 L284 262 L272 242" fill="white" filter="url(#glow)"/>
  <path d="M234 241 L230 255" stroke="white" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <path d="M278 241 L282 255" stroke="white" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>

  <!-- Bow tie -->
  <path d="M234 268 L256 280 L278 268 L278 290 L256 278 L234 290 Z" fill="#dc2626"/>
  <circle cx="256" cy="279" r="6" fill="#fbbf24"/>
  <circle cx="256" cy="277" r="2" fill="#fef08a" opacity="0.6"/>

  <!-- Left arm reaching to hold bill -->
  <path d="M195 305 C175 330 160 355 165 385 L185 385 C185 360 182 338 200 315 Z"
        fill="url(#skin)"/>

  <!-- Right arm reaching to hold bill -->
  <path d="M317 305 C335 330 345 355 340 385 L320 385 C322 360 325 338 310 315 Z"
        fill="url(#skin)"/>

  <!-- Bill / Receipt - held in front, both hands gripping -->
  <g transform="rotate(-5 256 400)" filter="url(#shadow)">
    <rect x="175" y="345" width="162" height="120" rx="6" fill="url(#bill)"/>
    <!-- Bite mark on top-right corner -->
    <path d="M322 345 L322 368 Q312 360 308 345 Z" fill="url(#bg)"/>
    <circle cx="317" cy="352" r="5" fill="url(#bg)"/>
    <!-- Dollar sign - large -->
    <text x="220" y="400" text-anchor="middle" font-size="52" font-weight="bold" fill="#059669" font-family="Arial, sans-serif">$</text>
    <!-- Receipt lines -->
    <rect x="245" y="378" width="75" height="5" rx="2.5" fill="#cbd5e1"/>
    <rect x="245" y="395" width="60" height="5" rx="2.5" fill="#cbd5e1"/>
    <rect x="245" y="412" width="68" height="5" rx="2.5" fill="#cbd5e1"/>
    <!-- Total separator -->
    <line x1="195" y1="432" x2="320" y2="432" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
    <!-- Total amount in red -->
    <rect x="195" y="440" width="50" height="6" rx="3" fill="#ef4444"/>
    <!-- Blood drip from bite -->
    <path d="M318 356 C320 368 317 378 316 384 C315 378 318 368 318 356" fill="#ef4444" opacity="0.85"/>
    <ellipse cx="316" cy="386" rx="3" ry="4" fill="#ef4444" opacity="0.7"/>
  </g>

  <!-- Left hand on bill - fingers visible -->
  <path d="M168 378 C162 385 164 398 172 400 C176 401 180 396 178 390 Z" fill="#fef08a"/>
  <path d="M175 374 C168 380 170 394 178 396 C182 397 186 392 184 386 Z" fill="#fef08a"/>
  <path d="M182 372 C176 377 177 390 185 392 C189 393 192 388 190 382 Z" fill="#fef08a"/>
  <!-- Thumb -->
  <path d="M165 384 C160 390 162 400 170 402 L172 400 C166 396 164 390 168 384 Z" fill="#fde68a"/>

  <!-- Right hand on bill - fingers visible -->
  <path d="M338 378 C344 385 342 398 334 400 C330 401 326 396 328 390 Z" fill="#fef08a"/>
  <path d="M331 374 C338 380 336 394 328 396 C324 397 320 392 322 386 Z" fill="#fef08a"/>
  <path d="M324 372 C330 377 329 390 321 392 C317 393 314 388 316 382 Z" fill="#fef08a"/>
  <!-- Thumb -->
  <path d="M341 384 C346 390 344 400 336 402 L334 400 C340 396 342 390 338 384 Z" fill="#fde68a"/>
</svg>
