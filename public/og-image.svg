<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0B11"/>
      <stop offset="100%" stop-color="#1a0a1a"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow effect -->
  <ellipse cx="600" cy="280" rx="400" ry="200" fill="#881337" opacity="0.15"/>

  <!-- Main headline -->
  <text x="600" y="180" text-anchor="middle" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700">
    How much have you wasted on
  </text>
  <text x="600" y="240" text-anchor="middle" fill="url(#rose)" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800">
    subscriptions in 10 years?
  </text>

  <!-- Shock number example -->
  <text x="600" y="360" text-anchor="middle" fill="url(#rose)" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" opacity="0.9">
    $15,352
  </text>
  <text x="600" y="410" text-anchor="middle" fill="#64748B" font-family="system-ui, sans-serif" font-size="22">
    average 10-year waste discovered by users
  </text>

  <!-- CTA -->
  <rect x="420" y="460" width="360" height="56" rx="16" fill="url(#gold)"/>
  <text x="600" y="496" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Drop a bill. Get the verdict.
  </text>

  <!-- Brand -->
  <text x="600" y="580" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="18">
    billvampire.com — $9.99 one-time
  </text>
</svg>
