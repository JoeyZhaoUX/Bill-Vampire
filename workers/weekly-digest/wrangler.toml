name = "bill-vampire-weekly-digest"
main = "src/index.js"
compatibility_date = "2026-04-01"

# Sunday 9:00 UTC.
[triggers]
crons = ["0 9 * * 0"]

# Bind the same EMAIL_LIST KV namespace used by the Pages app.
# Replace <paste-real-namespace-id> with the id you created under Workers KV.
[[kv_namespaces]]
binding = "EMAIL_LIST"
id = "006bcf18eaaf4ce9b7ac06a864d22d48"

# Non-secret vars. Secrets (RESEND_API_KEY) go in via `wrangler secret put`.
[vars]
APP_URL = "https://billvampire.com"
# STATS_URL = "https://billvampire.com/api/stats"  # optional override
